services:
  # Backend Web Service
  - type: web
    name: abishek-portfolio-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: abishek-portfolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false # Set this in the Render dashboard
      - key: ALLOWED_ORIGINS
        value: "https://abishek-portfolio.vercel.app,http://localhost:3000"

databases:
  - name: abishek-portfolio-db
    plan: free # Change to 'starter' for more performance
    region: oregan # Match this to your service region
